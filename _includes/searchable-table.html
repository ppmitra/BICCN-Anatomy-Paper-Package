{% comment %}
  Lazy-loads a CSV and renders a searchable table.
  Optional table_config: key in table-search.js TABLE_CONFIG (column hide/rename).
{% endcomment %}
<div class="searchable-table-wrapper" data-src="{{ include.data_url | relative_url }}"{% if include.table_config %} data-table-config="{{ include.table_config }}"{% endif %}>
  {% if include.tab_name %}
  <div class="table-tab-label">{{ include.tab_name }}</div>
  {% endif %}
  <div class="table-search-bar">
    <input type="search" class="table-search-input" placeholder="Search within this table..." aria-label="Search table" disabled>
  </div>
  <div class="table-scroll-container">
    <div class="table-loading">Loading table…</div>
  </div>
</div>
